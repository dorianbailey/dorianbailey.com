name: Refresh Bailey MetaZoo videos

# Every six hours, read the channel's public feed. If there is a new video,
# rebuild the pages so the MetaZoo television shows it, commit, and ask
# GitHub Pages to publish.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the feed and rebuild pages
        run: |
          python3 tools/youtube.py
          python3 tools/site.py .
      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new videos."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Refresh Bailey MetaZoo videos"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
