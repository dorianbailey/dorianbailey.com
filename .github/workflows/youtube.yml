name: Refresh videos and publish scheduled posts

# Every six hours, read the channel's public feed and rebuild the pages, so the
# MetaZoo television shows any new video and any journal post whose date has
# arrived (in Eastern time) goes live. Commit whatever changed, including new
# post pages, and ask GitHub Pages to publish.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch the feed and rebuild pages
        run: |
          python3 tools/youtube.py
          JOURNAL_TODAY=$(TZ=America/New_York date +%F) python3 tools/site.py .
      - name: Commit if anything changed
        id: commit
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh videos and scheduled journal posts"
            git pull --rebase -q origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
